<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="description" content="宝贝时光 - 记录宝宝成长点滴">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 高德地图 JS API - 用于定位功能 -->
  <script src="https://webapi.amap.com/maps?v=2.0&key=71e345af2fc2aa22d97b3d73d5cf12c8"></script>
  
  <title>宝贝时光 - 记录宝宝成长点滴</title>
</head>
<body class="bg-cream-50 dark:bg-gray-900">
  <div id="root"></div>
  
  <!-- 扣子 Chat SDK - 本地静态文件，确保加载成功 -->
  <script src="/static/coze-chat-sdk.js"></script>
  
  <style>
  /* ===== 扣子 SDK 样式定制 - 强制隐藏美观输出 ===== */
  
  /* 1. 确保悬浮按钮正常显示并强制显示图标 */
  [class*="coze-chat-float-btn"],
  [class*="coze-chat"] [class*="float-btn"],
  [class*="coze-chat"] button[class*="float"],
  [class*="coze-chat"] button[class*="launcher"] {
    display: flex !important;
    visibility: visible !important;
    opacity: 1 !important;
    z-index: 9999 !important;
    pointer-events: auto !important;
  }
  
  /* 强制显示悬浮按钮内部的图标 */
  [class*="coze-chat-float-btn"] svg,
  [class*="coze-chat-float-btn"] img,
  [class*="coze-chat-float-btn"] [class*="icon"],
  [class*="coze-chat"] [class*="float-btn"] svg,
  [class*="coze-chat"] [class*="float-btn"] img {
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
    width: 28px !important;
    height: 28px !important;
  }
  
  /* 强制隐藏悬浮按钮中的文字（只显示图标） */
  [class*="coze-chat-float-btn"]:not(svg):not(img),
  [class*="coze-chat-float-btn"] span:not([class*="icon"]),
  [class*="coze-chat-float-btn"] div:not([class*="icon"]),
  [class*="coze-chat"] [class*="float-btn"]:not(svg):not(img) {
    font-size: 0 !important;
    color: transparent !important;
    text-indent: -9999px !important;
  }
  
  /* 2. 强制隐藏"美观输出"、"美化输出"、"美观"、"AI生成"相关的所有元素 */
  [class*="beautify"],
  [class*="beauty-output"],
  [class*="aesthetic"],
  [class*="ai-generate"],
  [class*="ai-generation"],
  [class*="generate-output"],
  [class*="coze-chat"] [class*="beautify"],
  [class*="coze-chat"] [class*="beauty"],
  [class*="coze-chat"] [class*="aesthetic"],
  [class*="coze-chat"] [class*="ai-"]:not([class*="avatar"]):not([class*="message"]) {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
    width: 0 !important;
    height: 0 !important;
    overflow: hidden !important;
    position: absolute !important;
    left: -9999px !important;
  }
  
  /* 3. 隐藏包含"美观"/"美化"/"AI生成"文字的元素 */
  [class*="coze-chat"] [class*="action"]:has(:-webkit-any(:-webkit-any(:-webkit-any(:-webkit-any(:-webkit-any(*)))))) {
    /* 备用：如果JS代码生效，这部分不需要 */
  }
  
  /* 4. 隐藏头像（可选） - 如果需要隐藏头像启用下面的CSS */
  /*
  [class*="coze-chat"] [class*="avatar"],
  [class*="coze-chat"] [class*="user-avatar"],
  [class*="coze-chat"] [class*="bot-avatar"] {
    display: none !important;
  }
  */
  
  /* 5. 确保聊天窗口和输入框正常显示 */
  [class*="coze-chat"],
  [class*="coze-chat"] [class*="window"],
  [class*="coze-chat"] [class*="chat-window"],
  [class*="coze-chat"] [class*="input-area"],
  [class*="coze-chat"] textarea,
  [class*="coze-chat"] [class*="send-btn"] {
    display: block !important;
    visibility: visible !important;
  }
  
  /* 6. 隐藏输入框内的图标提示，保持输入框整洁 */
  [class*="coze-chat"] [class*="input-icon"],
  [class*="coze-chat"] [class*="placeholder-icon"] {
    display: none !important;
    width: 0 !important;
    height: 0 !important;
    min-width: 0 !important;
    min-height: 0 !important;
    padding: 0 !important;
    margin: 0 !important;
  }
  
  /* 7. 【新增】强制隐藏聊天输入框上方的美化按钮区域 */
  [class*="coze-chat"] [class*="input-toolbar"],
  [class*="coze-chat"] [class*="input-action"],
  [class*="coze-chat"] [class*="input-bar"],
  [class*="coze-chat"] [class*="rich-editor"],
  [class*="coze-chat"] [class*="editor-toolbar"],
  [class*="coze-chat"] [class*="format-toolbar"],
  [class*="coze-chat"] [class*="beautify-toolbar"] {
    display: none !important;
    height: 0 !important;
    min-height: 0 !important;
    overflow: hidden !important;
  }
  </style>

  <!-- ===== SDK Logo精准修复 v3.2.0 ===== -->
  <script>
  (function() {
    console.log('[SDK Logo Fix v3.2.0] 开始运行');
    
    let sdkButton = null;
    let isDragging = false;
    let startX = 0, startY = 0;
    let startLeft = 0, startTop = 0;
    
    setInterval(() => {
      if (sdkButton && document.body.contains(sdkButton)) {
        applyEnhancements(sdkButton);
        return;
      }
      
      const allElements = document.querySelectorAll('*');
      
      for (let i = 0; i < allElements.length; i++) {
        const el = allElements[i];
        try {
          const rect = el.getBoundingClientRect();
          const style = window.getComputedStyle(el);
          const className = (el.className || '').toString().toLowerCase();
          const innerText = (el.textContent || '').toString().toLowerCase();
          
          // 双重判断：
          // 1. 在右边区域
          // 2. 包含logo关键字（类名或文本）
          const hasLogoKeyword = className.includes('logo') || className.includes('icon') ||
                                innerText.includes('logo') || innerText.includes('icon');
          
          if (style.position === 'fixed' && 
              rect.width > 20 && 
              rect.height > 20 && 
              rect.left > window.innerWidth - 150 &&
              hasLogoKeyword) {  // ✅ 必须包含logo/icon关键字，不会误抓底部导航
            
            console.log('[SDK Fix] 🎯 抓到带logo的SDK按钮:', {
              tag: el.tagName,
              class: el.className
            });
            
            sdkButton = el;
            applyEnhancements(sdkButton);
            addDragSupport(sdkButton);
            return;
          }
        } catch (e) {}
      }
    }, 300);
    
    function applyEnhancements(btn) {
      btn.style.minWidth = '64px';
      btn.style.minHeight = '64px';
      btn.style.width = '64px';
      btn.style.height = '64px';
      btn.style.borderRadius = '50%';
      btn.style.backgroundColor = '#FF7B70';
      btn.style.backgroundImage = 'url("data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"%23fff\"><path d=\"M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z\"/></svg>")';
      btn.style.backgroundRepeat = 'no-repeat';
      btn.style.backgroundPosition = 'center';
      btn.style.backgroundSize = '32px 32px';
      btn.style.boxShadow = '0 4px 20px rgba(255, 123, 112, 0.5)';
      btn.style.display = 'flex';
      btn.style.alignItems = 'center';
      btn.style.justifyContent = 'center';
      btn.style.visibility = 'visible';
      btn.style.opacity = '1';
    }
    
    function addDragSupport(btn) {
      if (btn.getAttribute('data-drag-enabled')) return;
      
      const savedPos = localStorage.getItem('sdk-button-position');
      if (savedPos) {
        try {
          const pos = JSON.parse(savedPos);
          btn.style.right = 'auto';
          btn.style.bottom = 'auto';
          btn.style.left = pos.x + 'px';
          btn.style.top = pos.y + 'px';
        } catch (e) {}
      }
      
      btn.addEventListener('mousedown', startDrag);
      btn.addEventListener('touchstart', startDrag, { passive: false });
      document.addEventListener('mousemove', onDrag);
      document.addEventListener('touchmove', onDrag, { passive: false });
      document.addEventListener('mouseup', endDrag);
      document.addEventListener('touchend', endDrag);
      
      btn.setAttribute('data-drag-enabled', 'true');
      console.log('[SDK Fix] ✅ 拖拽功能已启用');
    }
    
    function startDrag(e) {
      const btn = e.target.closest('*');
      if (btn !== sdkButton) return;
      
      isDragging = true;
      const touch = e.touches ? e.touches[0] : e;
      startX = touch.clientX;
      startY = touch.clientY;
      
      const rect = btn.getBoundingClientRect();
      startLeft = rect.left;
      startTop = rect.top;
      
      btn.style.right = 'auto';
      btn.style.bottom = 'auto';
      btn.style.left = startLeft + 'px';
      btn.style.top = startTop + 'px';
      btn.style.transition = 'none';
      
      if (e.cancelable) e.preventDefault();
    }
    
    function onDrag(e) {
      if (!isDragging) return;
      
      const touch = e.touches ? e.touches[0] : e;
      const dx = touch.clientX - startX;
      const dy = touch.clientY - startY;
      
      sdkButton.style.left = (startLeft + dx) + 'px';
      sdkButton.style.top = (startTop + dy) + 'px';
      
      if (e.cancelable) e.preventDefault();
    }
    
    function endDrag(e) {
      if (!isDragging) return;
      isDragging = false;
      
      const rect = sdkButton.getBoundingClientRect();
      localStorage.setItem('sdk-button-position', JSON.stringify({
        x: rect.left,
        y: rect.top
      }));
      
      sdkButton.style.transition = 'all 0.2s ease';
    }
    
    // 检查并移除"美化输出"按钮
    setInterval(() => {
      const beautifyButtons = document.querySelectorAll('button[class*="beautify"], button[class*="beauty"], [class*="beautify"] button, [class*="ai-generate"]');
      beautifyButtons.forEach(btn => {
        btn.style.display = 'none';
        btn.style.visibility = 'hidden';
        btn.style.opacity = '0';
      });
    }, 500);
    
    console.log('[SDK Logo Fix v3.2.0] ✅ 已加载完成');
  })();
  </script>
  
  <!-- SDK 初始化 -->
  <script>
  window.addEventListener('load', function() {
    setTimeout(function() {
      if (typeof CozeWebSDK !== 'undefined' && !window.cozeClient) {
        window.cozeClient = new CozeWebSDK.WebChatClient({
          config: {
            bot_id: '7636350042466418731'
          },
          componentProps: {
            title: '虚拟时光助手'
          }
        });
        console.log('✅ SDK initialized');
      }
    }, 800);
  });
  </script>
  
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
