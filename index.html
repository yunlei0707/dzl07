<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA 配置 -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FF7B70" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="宝贝时光" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    
    <!-- 应用描述 -->
    <meta name="description" content="温馨记录宝宝成长的每一个珍贵瞬间" />
    
    <!-- Open Graph 分享预览卡片 -->
    <meta property="og:title" content="宝贝时光 - 记录宝宝成长点滴" />
    <meta property="og:description" content="用心记录每一个成长瞬间，保存宝宝最珍贵的回忆" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://new.ylmyyh.com" />
    <meta property="og:image" content="https://new.ylmyyh.com/og-preview.jpg" />
    <meta property="og:site_name" content="宝贝时光" />
    
    <!-- 微信分享优化 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="宝贝时光 - 记录宝宝成长点滴" />
    <meta name="twitter:description" content="用心记录每一个成长瞬间，保存宝宝最珍贵的回忆" />
    
    <!-- 高德地图 JS API - 用于定位功能 -->
    <script src="https://webapi.amap.com/maps?v=2.0&key=71e345af2fc2aa22d97b3d73d5cf12c8"></script>
    
    <title>宝贝时光 - 记录宝宝成长点滴</title>
  </head>
  <body class="bg-cream-50 dark:bg-gray-900">
    <div id="root"></div>
    <!-- 扣子 Chat SDK -->
    <script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/0.1.0-beta.3/libs/cn/index.js"></script>
    <script>
      // 直接初始化，不等待 load 事件
      function initCozeSDK() {
        try {
          if (window.CozeWebSDK) {
            window.cozeChat = new CozeWebSDK.WebChatClient({
              config: {
                bot_id: '7636350042466418731',
              },
              componentProps: {
                title: '虚拟时光助手',
              },
            });
            console.log('✅ 扣子 SDK 初始化成功');
          } else {
            console.log('⏳ CozeWebSDK 还未加载，稍后重试...');
            setTimeout(initCozeSDK, 500);
          }
        } catch (e) {
          console.error('❌ 扣子 SDK 初始化失败:', e);
        }
      }
      
      // 立即尝试初始化
      initCozeSDK();
    </script>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
