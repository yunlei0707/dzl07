<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA 配置 -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FF7B70" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="宝贝时光" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    
    <!-- 应用描述 -->
    <meta name="description" content="温馨记录宝宝成长的每一个珍贵瞬间" />
    
    <!-- Open Graph 分享预览卡片 -->
    <meta property="og:title" content="宝贝时光 - 记录宝宝成长点滴" />
    <meta property="og:description" content="用心记录每一个成长瞬间，保存宝宝最珍贵的回忆" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://new.ylmyyh.com" />
    <meta property="og:image" content="https://new.ylmyyh.com/og-preview.jpg" />
    <meta property="og:site_name" content="宝贝时光" />
    
    <!-- 微信分享优化 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="宝贝时光 - 记录宝宝成长点滴" />
    <meta name="twitter:description" content="用心记录每一个成长瞬间，保存宝宝最珍贵的回忆" />
    
    <!-- 高德地图 JS API - 用于定位功能 -->
    <script src="https://webapi.amap.com/maps?v=2.0&key=71e345af2fc2aa22d97b3d73d5cf12c8"></script>
    
    <title>宝贝时光 - 记录宝宝成长点滴</title>
  </head>
  <body class="bg-cream-50 dark:bg-gray-900">
    <div id="root"></div>
    <!-- 扣子 Chat SDK - 本地静态文件，确保加载成功 -->
    <script src="/static/coze-chat-sdk.js"></script>
    
    <script type="module" src="/src/main.jsx"></script>
  </body><!-- 扣子 Chat SDK -->
<script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.20/libs/cn/index.js"></script>
<style>
  /* ===== 隐藏扣子 SDK 不需要的元素 ===== */
  /* 隐藏底部 footer */
  [class*="coze-chat-footer"],
  [class*="footer"] {
    display: none !important;
    opacity: 0 !important;
    height: 0 !important;
    padding: 0 !important;
    margin: 0 !important;
    overflow: hidden !important;
  }
  
  /* 隐藏"美观输出"相关元素 */
  [class*="aesthetic"],
  [class*="beautify"],
  [class*="output"] {
    display: none !important;
  }
  
  /* 隐藏水印 */
  [class*="watermark"],
  [class*="powered-by"] {
    display: none !important;
  }
</style>

<script>
  // ===== 扣子 SDK 拖拽功能 =====
  (function() {
    let floatBtn = null;
    let isDragging = false;
    let startX = 0, startY = 0;
    let initialLeft = 0, initialTop = 0;
    
    // 从 localStorage 恢复位置
    function loadPosition() {
      try {
        const saved = localStorage.getItem('coze-sdk-float-position');
        if (saved) return JSON.parse(saved);
      } catch(e) {}
      return null;
    }
    
    // 保存位置到 localStorage
    function savePosition(left, top) {
      try {
        localStorage.setItem('coze-sdk-float-position', JSON.stringify({
          left, top, timestamp: Date.now()
        }));
      } catch(e) {}
    }
    
    // 应用位置到悬浮按钮
    function applyPosition(left, top) {
      if (!floatBtn) return;
      floatBtn.style.position = 'fixed';
      floatBtn.style.left = left + 'px';
      floatBtn.style.top = top + 'px';
      floatBtn.style.right = 'auto';
      floatBtn.style.bottom = 'auto';
      floatBtn.style.zIndex = '999999';
    }
    
    // 初始化拖拽
    function initDrag() {
      // 查找悬浮按钮
      const selectors = [
        '[class*="coze-chat-float-btn"]',
        '[class*="float-btn"]',
        '[class*="asst-btn"]',
        'button[aria-label*="chat"]',
        'button[class*="btn"]'
      ];
      
      for (const selector of selectors) {
        const el = document.querySelector(selector);
        if (el && el.getBoundingClientRect().width > 0) {
          floatBtn = el;
          break;
        }
      }
      
      if (!floatBtn) {
        console.log('🔍 未找到悬浮按钮，稍后重试...');
        setTimeout(initDrag, 500);
        return;
      }
      
      console.log('✅ 找到悬浮按钮，启用拖拽功能');
      
      // 恢复保存的位置
      const savedPos = loadPosition();
      if (savedPos) {
        applyPosition(savedPos.left, savedPos.top);
      }
      
      // 鼠标按下
      floatBtn.addEventListener('mousedown', function(e) {
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        
        const rect = floatBtn.getBoundingClientRect();
        initialLeft = rect.left;
        initialTop = rect.top;
        
        floatBtn.style.cursor = 'grabbing';
        floatBtn.style.userSelect = 'none';
        e.preventDefault();
        e.stopPropagation();
      }, true);
      
      // 鼠标移动
      document.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        
        const deltaX = e.clientX - startX;
        const deltaY = e.clientY - startY;
        
        let newLeft = initialLeft + deltaX;
        let newTop = initialTop + deltaY;
        
        // 边界限制
        const rect = floatBtn.getBoundingClientRect();
        const maxLeft = window.innerWidth - rect.width - 10;
        const maxTop = window.innerHeight - rect.height - 10;
        
        newLeft = Math.max(10, Math.min(maxLeft, newLeft));
        newTop = Math.max(10, Math.min(maxTop, newTop));
        
        applyPosition(newLeft, newTop);
      }, true);
      
      // 鼠标释放
      document.addEventListener('mouseup', function() {
        if (isDragging && floatBtn) {
          const rect = floatBtn.getBoundingClientRect();
          savePosition(rect.left, rect.top);
          floatBtn.style.cursor = 'grab';
        }
        isDragging = false;
      }, true);
      
      // 触摸事件支持
      floatBtn.addEventListener('touchstart', function(e) {
        isDragging = true;
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        
        const rect = floatBtn.getBoundingClientRect();
        initialLeft = rect.left;
        initialTop = rect.top;
        
        e.preventDefault();
      }, { passive: false });
      
      document.addEventListener('touchmove', function(e) {
        if (!isDragging) return;
        const touch = e.touches[0];
        
        const deltaX = touch.clientX - startX;
        const deltaY = touch.clientY - startY;
        
        let newLeft = initialLeft + deltaX;
        let newTop = initialTop + deltaY;
        
        const rect = floatBtn.getBoundingClientRect();
        const maxLeft = window.innerWidth - rect.width - 10;
        const maxTop = window.innerHeight - rect.height - 10;
        
        newLeft = Math.max(10, Math.min(maxLeft, newLeft));
        newTop = Math.max(10, Math.min(maxTop, newTop));
        
        applyPosition(newLeft, newTop);
        e.preventDefault();
      }, { passive: false });
      
      document.addEventListener('touchend', function() {
        if (isDragging && floatBtn) {
          const rect = floatBtn.getBoundingClientRect();
          savePosition(rect.left, rect.top);
        }
        isDragging = false;
      });
    }
    
    // 页面加载后初始化
    window.addEventListener('load', function() {
      setTimeout(initDrag, 1000);
    });
  })();
  
  // 初始化扣子 SDK
  window.addEventListener('load', function() {
    if (typeof CozeWebSDK !== 'undefined') {
      window.cozeClient = new CozeWebSDK.WebChatClient({
        config: {
          bot_id: '7636350042466418731'
        },
        componentProps: {
          title: '虚拟时光助手',
          theme: 'light',
          greeting: '记录下宝宝的成长瞬间，我来帮你们想象未来的美好时光～'
        }
      });
      console.log('✅ 扣子虚拟时光助手已启动');
    } else {
      console.error('❌ CozeWebSDK 加载失败');
    }
  });
</script>
</html>
